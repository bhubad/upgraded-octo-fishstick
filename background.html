<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OSRIC Character Sheet (background)</title>
<script>
  window.__obrMessages = [];
  window.addEventListener("message", function (e) {
    if (e && e.isTrusted && e.data && e.data.id === "OBR_READY") window.__obrMessages.push({ data: e.data, origin: e.origin });
  });
</script>
<script type="module" src="js/background.js?v=1.2.0"></script>
</head>
<body></body>
</html>
